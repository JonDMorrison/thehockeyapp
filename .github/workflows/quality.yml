name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Runtime packages are the application attack surface. Build-only tools
        # stay in devDependencies and are not deployed by Vercel.
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck, lint, build, and verify crawlable pages
        run: npm run check
