name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Runtime packages are the application attack surface. Build-only tools
        # stay in devDependencies and are not deployed by Vercel.
        run: npm audit --omit=dev --audit-level=high

      - name: Verify shooting challenge database release gates
        run: npm run test:shooting-db

      - name: Typecheck, lint, build, and verify crawlable pages
        run: npm run check

      - name: Install browser for public journey checks
        run: npx playwright install --with-deps chromium

      - name: Verify first visits on desktop and phone
        env:
          # Public UX checks need a syntactically valid client, never real accounts.
          # Network-dependent failure scenarios are intercepted in the tests.
          VITE_SUPABASE_URL: https://public-journey-test.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: public-journey-test-key
        run: npx playwright test e2e/10-public-launch.spec.ts e2e/12-first-visit.spec.ts e2e/14-recovery-and-accessibility.spec.ts --reporter=line
