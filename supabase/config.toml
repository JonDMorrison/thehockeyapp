[auth]
# Hosted Auth: password_hibp_enabled=false (Management API; not represented by CLI config).
# Allow simple passwords consistently with the six-character UI requirement.
minimum_password_length = 6
password_requirements = ""
site_url = "https://www.hockeyapp.ca"
additional_redirect_urls = []

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = false
max_frequency = "1m"
otp_length = 8

[auth.email.template.recovery]
subject = "Reset your Hockey App password"
content_path = "./supabase/templates/recovery.html"

